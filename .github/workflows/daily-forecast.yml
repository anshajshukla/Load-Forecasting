name: daily-forecast
# Every day: refresh Grid-India data and weather, forecast the next day, score earlier forecasts,
# and commit reports/live/forecasts.csv. These are the clean out-of-sample results.
on:
  schedule:
    - cron: "17 6 * * *"   # 11:47 IST, after Grid-India's daily report is usually out
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-forecast
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-pipeline.txt }
      - run: pip install -r requirements-pipeline.txt
      - name: Fetch latest Grid-India daily data (Robbie Andrew's processed POSOCO reports)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/robbieandrew/robbieandrew.github.io /tmp/ra
          git -C /tmp/ra sparse-checkout set india/data
          unzip -o -q /tmp/ra/india/data/POSOCO_data.zip -d /tmp/posoco
      - name: Refresh archive weather (last 30 days)
        run: python -c "from datetime import date, timedelta as t; from pipeline.forecast import merge_weather; from pipeline.real import fetch_weather; import pandas as pd; from pathlib import Path; d=date.today(); w=fetch_weather(d-t(30), d-t(6), Path('/tmp/w.csv')); merge_weather(w, prefer_new=True)"
      - name: Forecast and score
        run: python -m pipeline.forecast --posoco-csv /tmp/posoco/POSOCO_data.csv
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live data/posoco/delhi_daily.csv data/weather/delhi_hourly.csv
          git diff --cached --quiet || git commit -m "Daily forecast $(date -u +%F)"
          git push
