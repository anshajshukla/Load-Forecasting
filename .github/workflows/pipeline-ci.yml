name: pipeline-ci
on:
  pull_request:
    paths: ["pipeline/**", "tests/**", "requirements-pipeline.txt", ".github/workflows/pipeline-ci.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", "requirements-pipeline.txt"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-pipeline.txt }
      - run: pip install -r requirements-pipeline.txt
      - name: No-leakage and unit tests
        run: pytest -q tests
      - name: Backtest on the committed dataset
        run: python -m pipeline backtest --out reports
      - uses: actions/upload-artifact@v4
        with: { name: backtest-report, path: reports/ }
