# Clean white, professional theme (always light).
[theme]
base = "light"
primaryColor = "#1f5fbf"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1a1f2b"
font = "sans serif"
borderColor = "#e3e7ee"
showWidgetBorder = true
baseRadius = "small"

[theme.sidebar]
backgroundColor = "#f5f7fa"

[client]
toolbarMode = "minimal"
